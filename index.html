<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="FrogShorts — video vertikal ≤60 detik, CC Commons, atribusi otomatis, akun wajib (lokal).">
<title>FrogShorts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TOP -->
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 100 100" width="30" height="30"><rect x="4" y="4" width="92" height="92" rx="20" fill="#f6465d"/><path d="M34 28h32v10H50v8h14v10H50v16h-16z" fill="#fff"/></svg>
      <span>Shorts</span>
    </div>
    <div class="top-right">
      <button id="btnAccount" class="icon-btn" title="Akun">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><circle cx="12" cy="8.5" r="4.2"/><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5z"/></svg>
      </button>
    </div>
  </header>

  <!-- FEED -->
  <main id="feed" aria-label="Feed video"></main>
  <div id="emptyState" class="hidden"><div class="empty-inner"><svg viewBox="0 0 100 100" width="70" height="70"><rect x="4" y="4" width="92" height="92" rx="20" fill="#f6465d"/><path d="M34 28h32v10H50v8h14v10H50v16h-16z" fill="#fff"/></svg><h2>Shorts habis</h2><p>Geser terus untuk memuat lebih banyak</p><button id="btnReload">Muat ulang</button></div></div>

  <!-- SIDE ACTIONS -->
  <aside id="sideActions">
    <button class="act" id="btnLike" aria-label="Suka">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M12 21s-8.6-5.3-11.3-10.6C-.3 5.8 3.4 2.7 7.4 2.7c2.3 0 3.9 1.2 4.6 3.1 0.7-1.9 2.3-3.1 4.6-3.1 4 0 7.7 3.1 6.7 7.7C20.6 15.7 12 21 12 21z"/></svg>
      <span id="likeCount">0</span>
    </button>
    <button class="act" id="btnDislike" aria-label="Tidak suka">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M12 3s8.6 5.3 11.3 10.6C24.3 18.2 20.6 21.3 16.6 21.3c-2.3 0-3.9-1.2-4.6-3.1-.7 1.9-2.3 3.1-4.6 3.1C3.4 21.3-.3 18.2.3 13.6 3.4 8.3 12 3 12 3z"/></svg>
      <span id="dislikeCount">0</span>
    </button>
    <button class="act" id="btnShare" aria-label="Bagikan">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M18 16.1c-.76 0-1.44.3-1.96.77L8.9 12.7c.05-.23.1-.47.1-.7 0-.23-.05-.44-.1-.66l7.05-4.09A2.8 2.8 0 1 0 15 5.1c0 .23.04.49.1.72L8.1 9.9a2.8 2.8 0 1 0 0 4.2l7.05 4.09c-.05.23-.1.45-.1.68A2.8 2.8 0 1 0 18 16.1z"/></svg>
      <span>Bagikan</span>
    </button>
    <button class="act" id="btnSave" aria-label="Simpan">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-4 7 4V5a2 2 0 0 0-2-2z"/></svg>
      <span id="saveLabel">Simpan</span>
    </button>
  </aside>

  <!-- ACCOUNT GATE (wajib) -->
  <div id="accountGate" class="gate">
    <div class="gate-card">
      <svg viewBox="0 0 100 100" width="72" height="72"><rect x="4" y="4" width="92" height="92" rx="20" fill="#f6465d"/><path d="M34 28h32v10H50v8h14v10H50v16h-16z" fill="#fff"/></svg>
      <h1>FrogShorts</h1>
      <p class="gate-sub">Akun wajib — gratis &amp; tersimpan di HP ini saja</p>
      <div id="gateStepCreate">
        <input id="gateName" type="text" placeholder="Nama kamu" maxlength="32" autocomplete="off">
        <input id="gatePin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN 4 digit" maxlength="4" autocomplete="off">
        <button id="gateCreateBtn" class="gate-btn">Buat akun &amp; masuk</button>
      </div>
      <div id="gateStepLogin" class="hidden">
        <div class="gate-welcome">Halo lagi, <b id="gateWelcomeName">—</b></div>
        <input id="gatePinLogin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN kamu" maxlength="4" autocomplete="off">
        <button id="gateLoginBtn" class="gate-btn">Masuk</button>
        <button id="gateSwitchBtn" class="gate-link">Bukan kamu? Ganti akun</button>
      </div>
      <p class="gate-note">Video dari Wikimedia Commons — lisensi CC/Public Domain. Akunmu disimpan lokal di HP, bukan di server.</p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
