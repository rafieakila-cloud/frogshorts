<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="FrogShorts — video vertikal legal & gratis dari Wikimedia Commons (CC/Public Domain) dengan atribusi otomatis.">
<title>FrogShorts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TOP BAR -->
  <header id="topbar">
    <div class="tb-logo">
      <svg viewBox="0 0 100 100" width="26" height="26"><circle cx="50" cy="50" r="44" fill="#22c55e"/><circle cx="35" cy="42" r="13" fill="#052e16"/><circle cx="66" cy="42" r="13" fill="#052e16"/><circle cx="35" cy="42" r="5" fill="#faf6ec"/><circle cx="66" cy="42" r="5" fill="#faf6ec"/><path d="M30 68q20 14 40 0" stroke="#052e16" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
      <span>FrogShorts</span>
    </div>
    <div id="cats" class="cats">
      <button class="chip active" data-cat="frog">Kodok</button>
      <button class="chip" data-cat="nature timelapse">Alam</button>
      <button class="chip" data-cat="animal">Hewan</button>
      <button class="chip" data-cat="documentary">Dokumenter</button>
      <button class="chip" data-cat="indonesia">Indonesia</button>
      <button class="chip" data-cat="ocean">Samudra</button>
      <button class="chip" data-cat="city">Kota</button>
    </div>
    <button id="btnSearch" class="tb-btn" aria-label="Cari video">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-1.39 1.39l.27.27v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    </button>
  </header>

  <!-- SEARCH OVERLAY -->
  <div id="searchOverlay" class="hidden">
    <form id="searchForm">
      <input id="q" type="search" placeholder="Cari video (Commons)…" autocomplete="off" enterkeyhint="search">
      <button type="button" id="btnCloseSearch">Batal</button>
    </form>
    <div id="searchHint">sumber: Wikimedia Commons · semua video berlisensi bebas (CC/PD)</div>
  </div>

  <!-- FEED VERTIKAL -->
  <main id="feed"></main>

  <!-- STATUS / LOADING -->
  <div id="statusBar" class="hidden"><span class="spinner"></span><span id="statusText">memuat…</span></div>

  <!-- FOOTER ACTIONS (per video aktif) -->
  <aside id="sideActions">
    <button id="btnLike" class="act-btn" title="Suka (tersimpan di HP)">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="#fff"><path d="M12 21s-8.5-5.2-11-10.4C-.5 6 3 3 7 3c2.2 0 3.9 1.1 5 3 1.1-1.9 2.8-3 5-3 4 0 7.5 3 6 7.6C20.5 15.8 12 21 12 21z"/></svg>
      <span id="likeCount">0</span>
    </button>
    <button id="btnSource" class="act-btn" title="Sumber & lisensi">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>
    </button>
    <button id="btnInstall" class="act-btn hidden" title="Install FrogShorts">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </aside>

<script src="app.js"></script>
</body>
</html>
